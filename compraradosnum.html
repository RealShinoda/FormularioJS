<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar dos numeros</title>
</head>
<body>
    <h1>Comparacion de Dos Numeros</h1>
    <p id="numero"></p>
    <p id="numero2"></p>
    <p id="resultado"></p>
    <script>
    function compararDosnumeros() {
     let num1, num2, entrada;

     // Ciclo del primer numero
     do {
     entrada = prompt("Escribe primer numero a comparar");

      if (entrada === null || entrada.trim() === "") {
      document.getElementById("resultado").textContent = "Operacion cancelada por usuario";
     return;
      }

             num1 = parseFloat(entrada);
             if (isNaN(num1)) {
                    alert("Error solo puedes ingresar valores numericos");
                }
            } while (isNaN(num1));

            // Ciclo del segundo numero
            do {
                entrada = prompt("Escribe segundo numero a comparar");
                if (entrada === null || entrada.trim() === "") {
                    document.getElementById("resultado").textContent = "Operacion cancelada por usuario";
                    return;
                }
                num2 = parseFloat(entrada);
                if (isNaN(num2)) {
                    alert("Error solo puedes ingresar valores numericos");
                }
            } while (isNaN(num2));
            document.getElementById("numero").textContent = "Primer número: " + num1;
            document.getElementById("numero2").textContent = "Segundo número: " + num2;

            if (num1 === num2) {
                document.getElementById("resultado").textContent = "El número " + num1 + " es igual a " + num2;
            } else if (num1 > num2) {
                document.getElementById("resultado").textContent = "El número " + num1 + " es MAYOR que el número " + num2;
            } else {
                document.getElementById("resultado").textContent = "El número " + num2 + " es MAYOR que el número " + num1;
            }
        }

        compararDosnumeros();
    </script>
</body>
</html>
