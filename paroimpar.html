<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">

    <title>Algoritmo para determinar si es un numero par o impar</title>
</head>
<body>
<h1>Algoritmo para determinar si es un numero par o impar</h1>
<p id="resultado"></p>
<script>
function perform() {
  let entrada = prompt("Escriba un numero:");
  if (entrada === null) {
    document.getElementById("resultado").textContent = "Operación cancelada por usuario";
    return;
  }
  let n = parseFloat(entrada);
  if (isNaN(n)) {
    document.getElementById("resultado").textContent = "Solo puedes escribir valores numericos";
    return;
  }
  if (n % 2 === 0) {
    document.getElementById("resultado").textContent = "El numero"+ n +"es par";
  }
  if (n % 2 !== 0) {
    document.getElementById("resultado").textContent = "El numero"+ n +" es impar";
  }
}
perform();







</script>
</body>
</html>
