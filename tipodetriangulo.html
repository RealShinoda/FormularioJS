<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
    <title> Algoritmo para determinar tipo de Triangulo</title>
</head>
<body>
<h1>Algoritmo para determinar tipo de triangulo</h1>
<p id="resultado"></p>
<script>
function perform() {
  let e1 = prompt("Escriba el lado 1:");
  if (e1 === null) {
            document.getElementById("resultado").textContent = "Operación cancelada por usuario";
    return;
  }
     let e2 = prompt("Escriba el lado 2:");
      if (e2 === null) {
          document.getElementById("resultado").textContent = "Operación cancelada por usuario";
         return;
  }
     let e3 = prompt("Escriba el lado 3:");
     if (e3 === null) {
     document.getElementById("resultado").textContent = "Operación cancelada por usuario";
    return;
  }
     let l1 = parseFloat(e1);
     let l2 = parseFloat(e2);
     let l3 = parseFloat(e3);
  if (isNaN(l1) || isNaN(l2) || isNaN(l3)) {
    document.getElementById("resultado").textContent = "Error solo puedes ingresar valores numericos";
    return;
        }
            if (l1 === l2 && l2 === l3) {
            document.getElementById("resultado").textContent = "Equilatero:3 lados  iguales";
        }
            if (l1 === l2 && l1 !== l3) {
         document.getElementById("resultado").textContent = "Isosceles:2 lados  iguales 1 es diferente";
      }
        if (l1 === l3 && l1 !== l2) {
        document.getElementById("resultado").textContent = "Isosceles:2 lados iguales 1 es diferente";
       }
         if (l2 === l3 && l2 !== l1) {
        document.getElementById("resultado").textContent = "Isosceles:2 lados iguales y 1 diferente";
      }
         if (l1 !== l2 && l1 !== l3 && l2 !== l3) {
         document.getElementById("resultado").textContent = "Escaleno: 3 lados diferentes";
  }
}
perform();


</script>
</body>
</html>
