<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparar dos numeros</title>
</head>
<body>
    <h1>Comparacion de Dos Numeros</h1>
    <p id="numero"></p>
    <p id="resultado"></p>
    <script>
    function compararDosnumeros() {
        let num1, num2, entrada;

        do {
            entrada = prompt("Escribe el numero a comparar");

            if (entrada === null || entrada.trim() === "") {
                document.getElementById("resultado").textContent = "Operacion cancelada por usuario";
                return;
            }

            num1 = parseFloat(entrada);
            if (isNaN(num1)) {
                alert("Error solo puedes ingresar valores numericos");
            }
        } while (isNaN(num1));

        document.getElementById("numero").textContent = "Primer número: " + num1;

        if (num1 === 0) {
            document.getElementById("resultado").textContent = "El numero " + num1 + " es neutro";
        } else if (num1 > 0) {
            document.getElementById("resultado").textContent = "El numero " + num1 + " es positivo";
        } else {
            document.getElementById("resultado").textContent = "El numero " + num1 + " es negativo";
        }
    }

    compararDosnumeros();
    </script>
</body>
</html>
