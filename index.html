<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario con validacion</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="contenedor">
    <h2>Registrar Producto</h2>
    
    <form id="forminventario">
      <div class="grupo-input">
        <label for="producto">Nombre Producto</label>
        <input type="text" id="producto" placeholder="Ej: Teclado Mecanico"/>
        <span class="mensaje-error" id="errorproducto"></span>
      </div>  
      
      <div class="grupo-input">
        <label for="cantidad">Cantidad en Stock</label>
        <input type="text" id="cantidad" placeholder="Ej: 10"/>
        <span class="mensaje-error" id="errorcantidad"></span>
      </div>
    
      <div class="grupo-input">
        <label for="Precio">Precio Unitario($)</label>
        <input type="text" id="Precio" placeholder="Ej: 10"/>
        <span class="mensaje-error" id="errorprecio"></span>
      </div>
      
      <button type="submit">Guardar Producto</button>
      <p id="mensajeexito" class="mensaje-exito"></p>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
